server {
    listen 80;
    server_name localhost;

    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Прокси для валидатора (используем полное имя сервиса)
    location /api/validate/ {
        proxy_pass http://beatbattle_track_validator:5001/validate/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Прокси для нотификатора
    location /api/notify/ {
        proxy_pass http://beatbattle_rating_notifier:5002/notify/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health checks
    location /api/validate/health {
        proxy_pass http://beatbattle_track_validator:5001/health;
        proxy_set_header Host $host;
    }

    location /api/notify/health {
        proxy_pass http://beatbattle_rating_notifier:5002/health;
        proxy_set_header Host $host;
    }

    location / {
        return 200 "BeatBattle API\n\nEndpoints:\n- POST /api/validate/\n- POST /api/notify/\n- GET /api/validate/health\n- GET /api/notify/health\n";
        add_header Content-Type text/plain;
    }
}